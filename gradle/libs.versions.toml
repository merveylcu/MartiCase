[versions]

agp                     = "9.4.1"
kotlin                  = "2.4.20"
ksp                     = "2.3.12"
jvmToolchain            = "17"

detekt                  = "2.0.0-alpha.6"
composeRules            = "0.6.7"
spotless                = "8.10.3"
ktlint                  = "1.8.0"
moduleGraphAssert       = "2.9.1"

coreKtx                 = "1.17.0"
lifecycle               = "2.11.0"
activityCompose         = "1.13.0"

composeBom              = "2026.09.00"

hilt                    = "2.60.1"
androidxHilt            = "1.4.0"
javaxInject             = "1"

room                    = "2.8.5"
dataStore               = "1.2.1"

playServicesLocation    = "21.4.0"
mapsCompose             = "9.0.0"

kotlinxCoroutines       = "1.11.0"
kotlinxCollectionsImmutable = "0.5.2"

junit                   = "4.13.2"
junitExt                = "1.3.0"
androidxTestRunner      = "1.7.0"
turbine                 = "1.2.1"
mockk                   = "1.14.11"
truth                   = "1.4.5"
robolectric             = "4.17"
androidxTestCore        = "1.7.0"

[libraries]

android-gradlePlugin                = { group = "com.android.tools.build",  name = "gradle",                            version.ref = "agp" }
kotlin-gradlePlugin                 = { group = "org.jetbrains.kotlin",      name = "kotlin-gradle-plugin",              version.ref = "kotlin" }
compose-gradlePlugin                = { group = "org.jetbrains.kotlin",      name = "compose-compiler-gradle-plugin",    version.ref = "kotlin" }
hilt-gradlePlugin                   = { group = "com.google.dagger",         name = "hilt-android-gradle-plugin",        version.ref = "hilt" }
ksp-gradlePlugin                    = { group = "com.google.devtools.ksp",   name = "symbol-processing-gradle-plugin",   version.ref = "ksp" }
detekt-gradlePlugin                 = { group = "dev.detekt",                name = "dev.detekt.gradle.plugin",          version.ref = "detekt" }

detekt-compose-rules                = { group = "io.nlopez.compose.rules",   name = "detekt",                            version.ref = "composeRules" }

androidx-core-ktx                   = { group = "androidx.core",             name = "core-ktx",                          version.ref = "coreKtx" }
androidx-activity-compose           = { group = "androidx.activity",         name = "activity-compose",                  version.ref = "activityCompose" }

androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
androidx-lifecycle-process              = { group = "androidx.lifecycle", name = "lifecycle-process",              version.ref = "lifecycle" }

androidx-compose-bom                = { group = "androidx.compose",          name = "compose-bom",                       version.ref = "composeBom" }
androidx-compose-ui                 = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics        = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling         = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-compose-material3          = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons     = { group = "androidx.compose.material", name = "material-icons-core" }

hilt-android                        = { group = "com.google.dagger",          name = "hilt-android",                     version.ref = "hilt" }
hilt-android-compiler               = { group = "com.google.dagger",          name = "hilt-android-compiler",            version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose    = { group = "androidx.hilt",              name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
javax-inject                        = { group = "javax.inject",               name = "javax.inject",                     version.ref = "javaxInject" }

androidx-room-runtime               = { group = "androidx.room",      name = "room-runtime",          version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",      name = "room-ktx",              version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",      name = "room-compiler",         version.ref = "room" }
androidx-datastore-preferences      = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStore" }

play-services-location              = { group = "com.google.android.gms",    name = "play-services-location",            version.ref = "playServicesLocation" }
maps-compose                        = { group = "com.google.maps.android",   name = "maps-compose",                      version.ref = "mapsCompose" }
maps-compose-utils                  = { group = "com.google.maps.android",   name = "maps-compose-utils",                version.ref = "mapsCompose" }

kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",        version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core             = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",           version.ref = "kotlinxCoroutines" }
kotlinx-collections-immutable       = { group = "org.jetbrains.kotlinx",     name = "kotlinx-collections-immutable",     version.ref = "kotlinxCollectionsImmutable" }

junit                               = { group = "junit",                      name = "junit",                             version.ref = "junit" }
androidx-junit                      = { group = "androidx.test.ext",          name = "junit",                             version.ref = "junitExt" }
androidx-test-runner                = { group = "androidx.test",              name = "runner",                            version.ref = "androidxTestRunner" }
androidx-test-core                  = { group = "androidx.test",              name = "core-ktx",                          version.ref = "androidxTestCore" }
robolectric                         = { group = "org.robolectric",            name = "robolectric",                       version.ref = "robolectric" }
hilt-android-testing                = { group = "com.google.dagger",          name = "hilt-android-testing",              version.ref = "hilt" }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",           version.ref = "kotlinxCoroutines" }
turbine                             = { group = "app.cash.turbine",           name = "turbine",                           version.ref = "turbine" }
mockk                               = { group = "io.mockk",                   name = "mockk",                             version.ref = "mockk" }
truth                               = { group = "com.google.truth",           name = "truth",                             version.ref = "truth" }

[bundles]

compose     = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]

lifecycle   = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
]

coroutines  = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core",
]

[plugins]

android-application         = { id = "com.android.application",                         version.ref = "agp" }
android-library             = { id = "com.android.library",                             version.ref = "agp" }

kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",             version.ref = "kotlin" }
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",                        version.ref = "kotlin" }

ksp                         = { id = "com.google.devtools.ksp",                         version.ref = "ksp" }
hilt-android                = { id = "com.google.dagger.hilt.android",                  version.ref = "hilt" }

detekt                      = { id = "dev.detekt",                                       version.ref = "detekt" }
spotless                    = { id = "com.diffplug.spotless",                            version.ref = "spotless" }
module-graph-assert         = { id = "com.jraska.module.graph.assertion",               version.ref = "moduleGraphAssert" }

marticase-android-application       = { id = "marticase.android.application",           version = "unspecified" }
marticase-android-library           = { id = "marticase.android.library",               version = "unspecified" }
marticase-android-library-compose   = { id = "marticase.android.library.compose",      version = "unspecified" }
marticase-kotlin-library            = { id = "marticase.kotlin.library",                version = "unspecified" }
marticase-android-hilt              = { id = "marticase.android.hilt",                  version = "unspecified" }
marticase-android-versioning        = { id = "marticase.android.versioning",            version = "unspecified" }
marticase-kotlin-lint               = { id = "marticase.kotlin.lint",                   version = "unspecified" }
marticase-testing                   = { id = "marticase.testing",                       version = "unspecified" }
marticase-android-robolectric       = { id = "marticase.android.robolectric",           version = "unspecified" }
