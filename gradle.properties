org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/heap-dump.hprof -Dfile.encoding=UTF-8

kotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=768m

org.gradle.parallel=true

org.gradle.caching=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

org.gradle.daemon=true

org.gradle.vfs.watch=true

kotlin.code.style=official

kotlin.incremental=true

kotlin.build.report.output=file

kotlin.compose.stabilityConfigurationPath=config/compose/stability.conf

android.useAndroidX=true

android.nonTransitiveRClass=true

android.enableJetifier=false

android.defaults.buildfeatures.resvalues=false

android.defaults.buildfeatures.shaders=false

android.enableR8.fullMode=true

android.disallowKotlinSourceSets=true

org.gradle.tooling.parallel=true
